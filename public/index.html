<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXT GAME</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- TELA DE LOGIN / REGISTRO -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1>NEXT GAME</h1>
    <p class="subtitle">Comunidade para gamers e trabalho</p>

    <div class="auth-tabs">
      <button id="tab-login" class="auth-tab active">Entrar</button>
      <button id="tab-register" class="auth-tab">Criar conta</button>
    </div>

    <form id="form-login" class="auth-form">
      <input type="text" id="login-username" placeholder="Usuário" required />
      <input type="password" id="login-password" placeholder="Senha" required />
      <button type="submit">Entrar</button>
    </form>

    <form id="form-register" class="auth-form hidden">
      <input type="text" id="register-username" placeholder="Usuário (min. 3 caracteres)" required />
      <input type="password" id="register-password" placeholder="Senha (min. 6 caracteres)" required />
      <button type="submit">Criar conta</button>
    </form>

    <p id="auth-error" class="auth-error"></p>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      NEXT GAME
      <button id="btn-new-room" title="Criar sala">+</button>
    </div>

    <div id="categories-container"></div>

    <div class="sidebar-footer">
      <span id="me-username"></span>
      <a href="/admin.html" id="admin-link" class="hidden">Admin</a>
      <button id="btn-logout">Sair</button>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <span id="current-channel-name">Selecione um canal</span>
    </header>

    <!-- Painel de chat de texto -->
    <section id="text-panel" class="text-panel">
      <div id="messages" class="messages"></div>
      <form id="form-message" class="message-form">
        <input type="text" id="message-input" placeholder="Escreva uma mensagem..." autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </section>

    <!-- Painel de sala de voz / compartilhamento de tela -->
    <section id="voice-panel" class="voice-panel hidden">
      <div class="voice-controls">
        <button id="btn-share-screen">🖥️ Compartilhar tela</button>
        <button id="btn-stop-share" class="hidden">⏹️ Parar compartilhamento</button>
        <button id="btn-leave-voice">Sair da sala</button>
      </div>
      <div id="video-grid" class="video-grid"></div>
    </section>
  </main>
</div>

<!-- MODAL: criar sala/servidor -->
<div id="modal-new-room" class="modal-overlay hidden">
  <div class="modal-card">
    <h2>Criar sala</h2>
    <form id="form-new-room">
      <label>Nome da sala</label>
      <input type="text" id="room-name" placeholder="ex: valorant-comp, reuniao-semanal" required />

      <label>Servidor / categoria</label>
      <input type="text" id="room-category" list="category-options" placeholder="ex: Valorant, Trabalho, Minecraft" required />
      <datalist id="category-options"></datalist>
      <p class="hint">Se o nome não existir ainda, um novo servidor é criado automaticamente.</p>

      <label>Tipo</label>
      <select id="room-type">
        <option value="texto">Texto</option>
        <option value="voz">Voz (com compartilhamento de tela)</option>
      </select>

      <div class="modal-actions">
        <button type="button" id="btn-cancel-room">Cancelar</button>
        <button type="submit">Criar</button>
      </div>
      <p id="room-error" class="auth-error"></p>
    </form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
