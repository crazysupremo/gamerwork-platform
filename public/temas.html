<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estúdio de Temas — NEXT GAME</title>
<style>
  :root { --bg:#0e0f14; --panel:#16171e; --panel2:#1d1e27; --line:#2b2c38; --txt:#eceef6; --mut:#8e93a6; --ac:#5b6cff; --ok:#2ee59d; --bad:#ff5d6c; --warn:#ffc24a; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .hidden { display:none !important; }
  #guard { padding:40px; text-align:center; color:var(--mut); }
  button, select, input, textarea { font:inherit; color:var(--txt); }
  button { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:7px 13px; cursor:pointer; font-weight:600; }
  button:hover { border-color:var(--ac); }
  button.pri { background:var(--ac); border-color:var(--ac); color:#fff; }
  button.dan { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=datetime-local], select, textarea { width:100%; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  input[type=color] { width:38px; height:34px; padding:0; border:1px solid var(--line); border-radius:8px; background:none; cursor:pointer; }
  input[type=range] { width:100%; accent-color:var(--ac); margin:0; }

  /* ---------- estrutura: UMA página por vez ---------- */
  #studio { display:flex; flex-direction:column; height:100vh; }
  .topbar { display:flex; align-items:center; gap:14px; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0; flex-wrap:wrap; }
  .topbar .brand { font-weight:800; font-size:15px; }
  .topbar a.back { color:var(--mut); text-decoration:none; font-size:12px; }
  .nav { display:flex; gap:4px; margin:0 auto; }
  .nav button { background:transparent; border:0; border-bottom:2px solid transparent; border-radius:8px 8px 0 0; padding:9px 18px; color:var(--mut); font-size:14px; }
  .nav button.on { color:#fff; border-bottom-color:var(--ac); background:var(--panel2); }
  .nav button small { display:block; font-weight:500; font-size:10.5px; color:var(--mut); }
  .cur { color:var(--mut); font-size:12px; max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cur b { color:var(--txt); }
  .page { flex:1; min-height:0; overflow-y:auto; }
  .wrap { max-width:1100px; margin:0 auto; padding:22px 24px 40px; }

  /* ---------- página 1: lista ---------- */
  .listbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .listbar input[type=text] { max-width:320px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:4px 11px; font-size:12px; border-radius:99px; }
  .chip.on { background:var(--ac); border-color:var(--ac); color:#fff; }
  #list { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:16px; }
  .item { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; transition:.15s; }
  .item:hover { border-color:var(--ac); transform:translateY(-2px); }
  .item.sel { border-color:var(--ac); box-shadow:0 0 0 1px var(--ac); }
  .sw { display:flex; height:56px; } .sw i { flex:1; }
  .item .nm { padding:10px 12px 4px; } .item .nm b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .nm small { color:var(--mut); font-size:11.5px; }
  .item .tags { padding:4px 12px 12px; display:flex; gap:5px; flex-wrap:wrap; min-height:30px; }
  .tag { font-size:10px; padding:1px 7px; border-radius:6px; background:var(--panel2); border:1px solid var(--line); color:var(--mut); }
  .tag.draft { color:var(--warn); border-color:var(--warn); } .tag.sched { color:#7dd3fc; border-color:#7dd3fc; }

  /* ---------- página 2: editor ---------- */
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { background:transparent; border:0; border-bottom:2px solid transparent; border-radius:8px 8px 0 0; padding:9px 18px; color:var(--mut); }
  .tabs button.on { color:#fff; border-bottom-color:var(--ac); background:var(--panel2); }
  .form { display:grid; gap:14px; align-content:start; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
  .form.hidden { display:none !important; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:14px 15px; display:grid; gap:10px; min-width:0; align-content:start; }
  .card h4 { margin:0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#aab1ff; }
  .card.wide, .form > .card:first-child:last-child { grid-column:1 / -1; }
  label.f { display:grid; gap:4px; font-size:12px; color:var(--mut); font-weight:600; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .row2 > * { min-width:0; }
  .addrow { display:grid; grid-template-columns:1fr auto; gap:8px; }
  .crow { display:grid; grid-template-columns:90px 38px 1fr; gap:8px; align-items:center; }
  .crow span { font-size:12px; color:var(--mut); font-weight:600; }
  .rng { display:grid; grid-template-columns:90px 1fr 38px; gap:8px; align-items:center; font-size:12px; color:var(--mut); font-weight:600; }
  .rng b { color:var(--txt); text-align:right; }
  .toggle { display:flex; align-items:center; gap:8px; font-weight:600; } .toggle input { width:16px; height:16px; accent-color:var(--ac); }
  .sub { font-size:12px; color:var(--mut); line-height:1.4; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; }
  .presets button { padding:0; width:56px; height:26px; display:flex; overflow:hidden; border-radius:7px; } .presets button i { flex:1; }
  .audit { display:grid; gap:6px; } .audit div { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .itemgrid { display:flex; flex-wrap:wrap; gap:6px; max-height:170px; overflow-y:auto; }
  .itm { position:relative; min-width:42px; height:42px; display:grid; place-items:center; background:var(--bg); border:1px solid var(--line); border-radius:10px; cursor:pointer; padding:3px; }
  .itm:hover { border-color:var(--bad); } .itm.on { border-color:var(--ok); box-shadow:0 0 0 1px var(--ok); }
  .itm small { position:absolute; right:3px; bottom:0; font-size:9px; color:var(--mut); }
  .emo { display:flex; flex-wrap:wrap; gap:3px; max-height:130px; overflow-y:auto; } .emo button { padding:3px 5px; font-size:20px; line-height:1; background:transparent; }
  pre.code { background:#0a0b10; border:1px solid var(--line); border-radius:10px; padding:10px; overflow:auto; margin:0; font:12px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-all; }
  .actions { position:sticky; bottom:0; margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:10px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .actions .sp { flex:1; }

  /* ---------- página 3: preview ---------- */
  #page-prev { display:flex; flex-direction:column; overflow:hidden; }
  .pbar { display:flex; gap:6px; align-items:center; padding:10px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; flex-shrink:0; }
  .pwrap { flex:1; min-height:0; display:grid; place-items:center; padding:16px; background:repeating-conic-gradient(#12131a 0 25%, #0e0f14 0 50%) 0 0/24px 24px; }
  .frame { background:#000; border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); height:100%; width:100%; transition:width .25s; }
  .frame.tablet { width:820px; max-width:100%; } .frame.phone { width:390px; max-width:100%; }
  .frame iframe { width:100%; height:100%; border:0; display:block; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--ac); padding:10px 16px; border-radius:11px; z-index:50; max-width:90vw; }
  @media (max-width:700px) { .wrap { padding:14px 12px 30px; } .form { grid-template-columns:1fr; } .nav button { padding:8px 10px; } .nav button small { display:none; } }
</style>
</head>
<body>
<div id="guard">Verificando acesso…</div>
<div id="studio" class="hidden">
  <header class="topbar">
    <a class="back" href="/admin.html">← Admin</a>
    <span class="brand">Estúdio de Temas</span>
    <nav class="nav" id="nav">
      <button data-page="list" class="on">1. Temas<small>escolher ou criar</small></button>
      <button data-page="edit">2. Editar<small>cores, figurinhas, efeitos</small></button>
      <button data-page="prev">3. Preview<small>ver ao vivo</small></button>
    </nav>
    <span class="cur" id="cur"></span>
  </header>

  <section class="page" id="page-list">
    <div class="wrap">
      <div class="listbar">
        <input type="text" id="q" placeholder="Buscar tema…" />
        <button id="btn-new" class="pri">+ Novo tema</button>
        <button id="btn-import">Importar JSON</button>
        <button id="btn-export-all">Exportar tudo</button>
      </div>
      <div class="chips" id="cats"></div>
      <div id="list"></div>
    </div>
  </section>

  <section class="page hidden" id="page-edit">
    <div class="wrap" id="editor-col">
      <div class="tabs" id="tabs">
        <button data-tab="basic" class="on">Cores</button><button data-tab="fx">Estilo</button><button data-tab="fx2">Figurinhas e FX</button><button data-tab="pub">Publicar</button><button data-tab="api">API</button>
      </div>
      <div class="form" id="tab-basic"></div>
      <div class="form hidden" id="tab-fx"></div>
      <div class="form hidden" id="tab-fx2"></div>
      <div class="form hidden" id="tab-pub"></div>
      <div class="form hidden" id="tab-api"></div>
      <div class="actions">
        <button id="btn-save" class="pri">Salvar</button>
        <button id="btn-go-prev">Ver preview →</button>
        <span class="sp"></span>
        <button id="btn-dup">Duplicar</button>
        <button id="btn-exp">Exportar</button>
        <button id="btn-del" class="dan">Excluir</button>
      </div>
    </div>
  </section>

  <section class="page hidden" id="page-prev">
    <div class="pbar">
      <button data-dev="" class="on chip">Computador</button><button data-dev="tablet" class="chip">Tablet</button><button data-dev="phone" class="chip">Celular</button>
      <span style="flex:1"></span>
      <button id="btn-summon">Chamar mascote</button>
      <button id="btn-fullscreen">Tela cheia</button>
      <button id="btn-back-edit">← Voltar a editar</button>
      <button id="btn-save2" class="pri">Salvar</button>
    </div>
    <div class="pwrap"><div class="frame" id="frame"><iframe id="stage" src="/temas-stage.html" title="Preview"></iframe></div></div>
  </section>
</div>
<input type="file" id="file-in" accept="application/json,.json" class="hidden" />
<script src="/temas.js?v=0.98.5"></script>
</body>
</html>
